<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/c_spes.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPES Login - Redirecting to DOLE Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script>
    // --- START: SPES LOGIN REDIRECT HANDLER - Directs users to central DOLE Portal login ---
    (function () {
      try {
        const raw = sessionStorage.getItem('spes_session') || localStorage.getItem('spes_session');
        const session = raw ? JSON.parse(raw) : null;
        const isApproved = session && (session.approved === true || session.approved === "true" || session.approved === 1);

        if (session && isApproved) {
          window.location.replace('/src/frontend/pages/dashboard/');
          return;
        }
      } catch (e) {}

      const destination = encodeURIComponent(window.location.origin + '/src/frontend/pages/dashboard/');
      window.location.replace('https://dole-portal.vercel.app/?redirect=' + destination);
    })();
    // --- END: SPES LOGIN REDIRECT HANDLER ---
  </script>
</head>
<body class="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full text-center space-y-4">
    <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Redirecting to Central Portal Login</h1>
    <p class="text-sm text-slate-400">All DOLE systems now use unified single sign-on.</p>
    <div class="pt-4">
      <a href="https://dole-portal.vercel.app/" class="cursor-pointer inline-flex items-center justify-center px-5 py-2.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-300">
        Click here to sign in
      </a>
    </div>
  </div>
</body>
</html>

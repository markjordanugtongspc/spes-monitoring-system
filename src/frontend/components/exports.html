<!--
  SPES Monitoring Report — Print Template Component
  ===================================================
  Reference template for the Exports & Reports page.
  Rendered dynamically at runtime by:
    src/frontend/assets/js/exports.js → _printReport()

  The JS injects built content into #print-area before calling window.print().
  @page orientation is set dynamically based on the user's Configure Reports setting.
-->

<!-- ══════════════════════════════════════════════════════════
     PRINT AREA — Hidden in browser, visible only when printing
     ══════════════════════════════════════════════════════════ -->
<div id="print-area" aria-hidden="true" class="flex w-full justify-center">
  <!-- Dynamically injected by exports.js _printReport() -->
  <!--
    Injected structure:
    When one or two columns are configured, the generated report table is
    centered in its available width so compact exports do not hug the left edge.
    Records missing any configured column value render below the complete table
    in the live preview as a lower-priority Missing Data section. XLSX keeps the
    complete and incomplete sections separate with their own selected-column
    headers, count summaries, footers, and group sorting.
    ┌──────────────────────────────────────────────────────┐
    │  [Watermark: c_spes.png at 4% opacity, fixed]        │
    │                                                      │
    │  ┌── HEADER ──────────────────────────────────────┐  │
    │  │  [Logo]  Dept of Labor and Employment          │  │
    │  │          Lanao del Norte Provincial Field Off. │  │
    │  │          OREDC Building, Badelles St. Ext...   │  │
    │  │                        SPES Monitoring Report  │  │
    │  │                        Generated: [date/time]  │  │
    │  │                        [filter summary]        │  │
    │  └────────────────────────────────────────────────┘  │
    │                                                      │
    │  ┌── TABLE ───────────────────────────────────────┐  │
    │  │  COMPLETE DATA        │ MISSING DATA (RIGHT)   │  │
    │  │  group-sorted rows    │ same configured cols   │  │
    │  │  selected col order   │ group order preserved  │  │
    │  └────────────────────────────────────────────────┘  │
    │                                                      │
    │  ┌── SIGNATURES ──────────────────────────────────┐  │
    │  │  Prepared by: _________   Approved by: _______ │  │
    │  └────────────────────────────────────────────────┘  │
    │                                                      │
    │  ┌── FOOTER ──────────────────────────────────────┐  │
    │  │  © 2026 System V0.2.1 Developed by Mark Jordan │  │
    │  │  Ugtong | Exclusive Property of DOLE Iligan    │  │
    │  └────────────────────────────────────────────────┘  │
    └──────────────────────────────────────────────────────┘
  -->
</div>

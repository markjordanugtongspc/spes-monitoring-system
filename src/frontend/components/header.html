        <li>

            class="cursor-pointer flex items-center justify-between font-medium text-spes-black hover:text-spes-blue dark:text-spes-white dark:hover:text-spes-yellow">

                  <ul class="space-y-1 p-2 text-sm font-medium text-spes-black dark:text-spes-white">
                    <li><a href="https://www.facebook.com/DOLE10LDNPFO" target="_blank" rel="noopener noreferrer"

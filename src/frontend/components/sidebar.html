<script>
  // --- FUNCTION: INIT MOBILE SIDEBAR DRAWER OBSERVER (START) ---
  // Smart Toggle Logic for Mobile Drawer Handle
  (function initMobileSidebarObserver() {
    const sidebar = document.getElementById('sidebar-dashboard');
    const toggleBtn = document.getElementById('sidebar-toggle-btn');

    if (!sidebar || !toggleBtn) return;

    // We watch for the 'translate-x-0' class which indicates the sidebar is open
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.attributeName === 'class') {
          const isOpen = !sidebar.classList.contains('translate-x-full') &&
            !sidebar.classList.contains('-translate-x-full');
          if (isOpen) {
            toggleBtn.classList.add('hidden');
          } else {
            toggleBtn.classList.remove('hidden');
          }
        }
        if (mutation.attributeName === 'aria-hidden') {
          if (sidebar.getAttribute('aria-hidden') === 'true') {
            if (sidebar.contains(document.activeElement)) {
              document.activeElement.blur();
            }
          }
        }
      });
    });

    observer.observe(sidebar, { attributes: true, attributeFilter: ['class', 'aria-hidden'] });
  })();
  // --- FUNCTION: INIT MOBILE SIDEBAR DRAWER OBSERVER (END) ---
</script>

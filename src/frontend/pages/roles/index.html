<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roles & Permissions | SPES Portal</title>
  <link rel="icon" type="image/png" href="/c_spes.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap"
    rel="stylesheet" />
  <script>
    if (localStorage.getItem('color-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body
  class="bg-spes-white font-inter text-spes-black transition-colors duration-300 dark:bg-spes-dark-secondary dark:text-spes-white">
  <!-- SPES:SIDEBAR -->

  <main class="min-h-screen transition-all duration-300 sm:ml-64 2xl:ml-80">
    <!-- Top Enterprise Banner -->
    <header class="relative overflow-hidden -mt-px bg-spes-blue dark:bg-spes-dark-primary p-6 pb-24 shadow-lg">
      <!-- Background Image Layer -->
      <div
        class="absolute inset-0 z-0 bg-[url('../../assets/img/other/spes-landscape.png')] bg-cover bg-center bg-no-repeat opacity-50 dark:opacity-30">
      </div>
      <!-- Primary Color Overlay (Reduced Opacity) -->
      <div
        class="absolute inset-0 z-0 bg-gradient-to-br from-spes-blue/85 to-[#002878]/95 dark:from-spes-dark-primary/90 dark:to-[#0A0A0A]/95">
      </div>

      <div class="relative z-30 mx-auto max-w-7xl 2xl:max-w-[2200px]">
        <div class="flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <div class="flex flex-col sm:flex-row sm:items-center gap-3">
              <h1 class="font-montserrat text-3xl font-black text-spes-white">Role & Permissions</h1>
              <span class="inline-flex rounded bg-rose-500/20 px-2.5 py-0.5 text-[10px] font-black uppercase tracking-widest text-rose-200 border border-rose-500/30 w-max">
                Administrative Permissions
              </span>
            </div>
            <p class="mt-2 text-sm text-spes-white/70">Manage and dynamically adjust core system database access rights for all roles.
            </p>
          </div>
        </div>
      </div>
    </header>

    <div class="mx-auto -mt-16 max-w-7xl 2xl:max-w-[2200px] px-6 pb-12 relative z-20">
      <!-- ════════════════════════════════════════════════════ -->
      <!-- PERMISSIONS MANAGER DIRECTORY TABLE -->
      <!-- ════════════════════════════════════════════════════ -->
      <section
        class="relative overflow-visible rounded-xl border border-spes-blue/10 bg-spes-white shadow-sm dark:border-spes-white/10 dark:bg-spes-dark-primary">
        <div class="w-full align-middle">
          <div class="overflow-visible">
            <!-- Table Header Bar (Premium Gradient) -->
            <div
              class="relative z-50 flex flex-col items-stretch justify-between gap-3 bg-gradient-to-r from-spes-blue to-[#002878] p-4 sm:flex-row sm:items-center border-b border-white/10 rounded-t-xl overflow-visible">
              <!-- Left Side: Bulk Action Buttons (hidden by default, displayed when checkboxes selected) -->
              <div id="staff-bulk-actions" data-permission="users:manage" class="hidden order-2 sm:order-1 flex-wrap items-center gap-2 w-full sm:w-auto">
                <button id="btn-bulk-grant" type="button"
                  class="cursor-pointer inline-flex items-center gap-1.5 rounded-lg bg-emerald-600/90 hover:bg-emerald-500 text-white px-3.5 py-1.5 text-xs font-bold shadow-md shadow-emerald-950/20 backdrop-blur-md hover:shadow-lg hover:shadow-emerald-500/20 active:scale-95 focus:outline-none focus:ring-2 focus:ring-emerald-400/50 transition-all border border-emerald-400/30"
                  title="Grant All (Selected)">
                  <svg class="h-3.5 w-3.5 text-emerald-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                  </svg>
                  <span>Grant All</span>
                </button>
                <button id="btn-bulk-revoke" type="button"
                  class="cursor-pointer inline-flex items-center gap-1.5 rounded-lg bg-rose-600/90 hover:bg-rose-500 text-white px-3.5 py-1.5 text-xs font-bold shadow-md shadow-rose-950/20 backdrop-blur-md hover:shadow-lg hover:shadow-rose-500/20 active:scale-95 focus:outline-none focus:ring-2 focus:ring-rose-400/50 transition-all border border-rose-400/30"
                  title="Revoke All (Selected)">
                  <svg class="h-3.5 w-3.5 text-rose-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                  <span>Revoke All</span>
                </button>
              </div>

              <!-- Right Side: Search (anchored right, medium width sizing) -->
              <div class="order-1 sm:order-2 sm:ms-auto flex w-full min-w-0 items-center justify-end overflow-visible relative z-30 sm:w-auto">
                <div class="relative w-full min-w-0 sm:w-64 md:w-80">
                  <div class="pointer-events-none absolute inset-y-0 start-0 z-10 flex items-center ps-3">
                    <svg class="h-4 w-4 text-white/70" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z"/>
                      <path fill-rule="evenodd" d="M21.707 21.707a1 1 0 0 1-1.414 0l-3.5-3.5a1 1 0 0 1 1.414-1.414l3.5 3.5a1 1 0 0 1 0 1.414Z" clip-rule="evenodd"/>
                    </svg>
                  </div>
                  <input type="text" id="staff-search-input"
                    class="block h-9 w-full rounded-lg border border-white/20 bg-white/10 py-1.5 pe-7 ps-9 text-xs text-white placeholder-white/60 outline-none transition-all placeholder:text-xs hover:bg-white/15 focus:border-white focus:bg-white/20 focus:ring-1 focus:ring-white backdrop-blur-sm"
                    placeholder="Search role..." />
                  <button type="button" id="staff-search-clear"
                    class="cursor-pointer absolute inset-y-0 end-0 hidden items-center pe-2.5 text-white/60 hover:text-white"
                    title="Clear search">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Scrollable Table Wrapper -->
            <div id="roles-table-wrapper" class="overflow-x-auto w-full select-none sm:select-auto transition-all">
              <!-- Table -->
              <table class="w-full min-w-[750px] lg:min-w-full text-sm text-spes-black/70 dark:text-spes-white/70">
                <thead
                  class="border-b border-t border-spes-blue/10 bg-spes-blue/4 text-xs font-semibold uppercase tracking-wider text-spes-black/60 dark:border-spes-white/10 dark:bg-spes-white/4 dark:text-spes-white/50">
                  <tr>
                    <th scope="col" class="p-4 text-center w-4">
                      <div class="flex items-center justify-center">
                        <input id="staff-checkbox-all" type="checkbox"
                          class="h-4 w-4 cursor-pointer rounded-full border-spes-blue/25 text-spes-blue focus:ring-2 focus:ring-spes-blue/20 dark:border-spes-white/25 dark:bg-spes-dark-secondary dark:text-spes-yellow">
                      </div>
                    </th>
                    <th scope="col" class="px-6 py-3 text-left whitespace-nowrap">ID No.</th>
                    <th scope="col" class="px-6 py-3 text-left whitespace-nowrap">Name</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">Office</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">View Users</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap" title="Read-only access to rosters outside the assigned office">Other Offices</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap" title="Global dashboard analytics; the gender donut remains office-scoped">Global Charts</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">Create Users</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">Edit Users</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">Archive Users</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap" title="Expand exports to other offices the user is permitted to view">Cross-office Export</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap" title="Allows this staff account to view and access SPES Payroll for its assigned office">View Payroll</th>
                    <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">Action</th>
                  </tr>
                </thead>
                <tbody id="staff-table-body">
                  <!-- Tabular List Skeleton Rows (5 Rows) -->
                  <tr class="animate-pulse border-b border-gray-100 dark:border-white/5 bg-white dark:bg-spes-dark-primary">
                    <td class="p-4 text-center"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-full mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8"></div></td>
                    <td class="px-6 py-4">
                      <div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-32 mb-2"></div>
                      <div class="h-2 bg-gray-200 dark:bg-white/10 rounded-full w-24"></div>
                    </td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-20 mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8 mx-auto"></div></td>
                  </tr>
                  <tr class="animate-pulse border-b border-gray-100 dark:border-white/5 bg-white dark:bg-spes-dark-primary">
                    <td class="p-4 text-center"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-full mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8"></div></td>
                    <td class="px-6 py-4">
                      <div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-24 mb-2"></div>
                      <div class="h-2 bg-gray-200 dark:bg-white/10 rounded-full w-28"></div>
                    </td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-20 mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8 mx-auto"></div></td>
                  </tr>
                  <tr class="animate-pulse border-b border-gray-100 dark:border-white/5 bg-white dark:bg-spes-dark-primary">
                    <td class="p-4 text-center"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-full mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8"></div></td>
                    <td class="px-6 py-4">
                      <div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-28 mb-2"></div>
                      <div class="h-2 bg-gray-200 dark:bg-white/10 rounded-full w-32"></div>
                    </td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-20 mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8 mx-auto"></div></td>
                  </tr>
                  <tr class="animate-pulse border-b border-gray-100 dark:border-white/5 bg-white dark:bg-spes-dark-primary">
                    <td class="p-4 text-center"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-full mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8"></div></td>
                    <td class="px-6 py-4">
                      <div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-30 mb-2"></div>
                      <div class="h-2 bg-gray-200 dark:bg-white/10 rounded-full w-24"></div>
                    </td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-20 mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8 mx-auto"></div></td>
                  </tr>
                  <tr class="animate-pulse border-b border-gray-100 dark:border-white/5 bg-white dark:bg-spes-dark-primary">
                    <td class="p-4 text-center"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-full mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8"></div></td>
                    <td class="px-6 py-4">
                      <div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-26 mb-2"></div>
                      <div class="h-2 bg-gray-200 dark:bg-white/10 rounded-full w-36"></div>
                    </td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-20 mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-4 w-4 bg-gray-200 dark:bg-white/10 rounded-md mx-auto"></div></td>
                    <td class="px-6 py-4"><div class="h-2.5 bg-gray-200 dark:bg-white/10 rounded-full w-8 mx-auto"></div></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <nav class="flex flex-col items-center justify-between gap-3 p-4 sm:flex-row" aria-label="Table navigation">
              <div class="flex flex-wrap items-center gap-3">
                <span class="text-sm text-spes-black/60 dark:text-spes-white/60">
                  Showing <span id="pagination-range"
                    class="font-semibold text-spes-black dark:text-spes-white">1-10</span> of <span id="pagination-total"
                    class="font-semibold text-spes-black dark:text-spes-white">0</span>
                </span>
                <!-- Dynamic Page Size Selector (Show 5, 10, 25, 50, All) -->
                <div id="page-size-selector-container" class="flex items-center gap-1.5 text-xs text-spes-black/60 dark:text-spes-white/60">
                  <label for="page-size-select" class="font-medium whitespace-nowrap">Show:</label>
                  <select id="page-size-select"
                    class="cursor-pointer rounded-lg border border-gray-200 bg-white px-2.5 py-1 text-xs font-bold text-spes-black shadow-sm focus:border-spes-blue focus:outline-none dark:border-white/10 dark:bg-spes-dark-secondary dark:text-white dark:focus:border-spes-yellow transition-all">
                  </select>
                </div>
              </div>
              <ul id="pagination-controls" class="grid w-full grid-cols-2 items-center justify-center gap-2 text-sm sm:flex sm:w-auto sm:-space-x-px sm:gap-0">
                <li class="w-full sm:w-auto"><button id="prev-page"
                    class="cursor-pointer w-full whitespace-nowrap text-center rounded-lg border sm:rounded-s-lg border-rose-200 bg-rose-50 px-3 py-2.5 text-sm font-bold text-rose-700 shadow-sm transition-colors hover:bg-rose-100 disabled:pointer-events-none disabled:opacity-40 dark:border-rose-400/20 dark:bg-rose-400/10 dark:text-rose-200">Previous</button>
                </li>
                <li id="page-indicators-container" class="order-3 col-span-2 flex w-full flex-wrap items-center justify-center -space-x-px sm:order-none sm:col-span-1 sm:w-auto"></li>
                <li class="w-full sm:w-auto"><button id="next-page"
                    class="cursor-pointer w-full whitespace-nowrap text-center rounded-lg border sm:rounded-e-lg border-emerald-200 bg-emerald-50 px-3 py-2.5 text-sm font-bold text-emerald-700 shadow-sm transition-colors hover:bg-emerald-100 disabled:pointer-events-none disabled:opacity-40 dark:border-emerald-400/20 dark:bg-emerald-400/10 dark:text-emerald-200">Next</button>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="../../assets/js/dashboard.js"></script>
</body>

</html>
